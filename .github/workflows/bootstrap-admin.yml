name: Bootstrap Admin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BOOTSTRAP_ADMIN_MOBILE: ${{ secrets.BOOTSTRAP_ADMIN_MOBILE }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BOOTSTRAP_ADMIN_NAME: ${{ secrets.BOOTSTRAP_ADMIN_NAME }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL is missing"; exit 1; }
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must be a PostgreSQL connection string"; exit 1 ;;
          esac
          test -n "$SESSION_SECRET" || { echo "::error::SESSION_SECRET is missing"; exit 1; }
          test -n "$BOOTSTRAP_ADMIN_MOBILE" || { echo "::error::BOOTSTRAP_ADMIN_MOBILE is missing"; exit 1; }
          test -n "$BOOTSTRAP_ADMIN_PASSWORD" || { echo "::error::BOOTSTRAP_ADMIN_PASSWORD is missing"; exit 1; }
          test -n "$BOOTSTRAP_ADMIN_NAME" || { echo "::error::BOOTSTRAP_ADMIN_NAME is missing"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create initial admin
        run: npm run db:bootstrap-admin
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BOOTSTRAP_ADMIN_MOBILE: ${{ secrets.BOOTSTRAP_ADMIN_MOBILE }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BOOTSTRAP_ADMIN_NAME: ${{ secrets.BOOTSTRAP_ADMIN_NAME }}
