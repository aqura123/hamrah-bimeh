
name: Database Migrations - Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamrah-bimeh-production-db-migrations
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose PostgreSQL and Migration Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Diagnose database connection and schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';

          const databaseUrl = process.env.DATABASE_URL;

          if (
            !databaseUrl ||
            !/^postgres(?:ql)?:\/\//i.test(databaseUrl)
          ) {
            throw new Error('DATABASE_URL is missing or invalid.');
          }

          const pool = new pg.Pool({
            connectionString: databaseUrl,
            max: 1,
            connectionTimeoutMillis: 10000
          });

          try {
            const client = await pool.connect();

            try {
              console.log('\n========== DATABASE IDENTITY ==========\n');

              const identity = await client.query(`
                SELECT
                  current_database() AS database_name,
                  current_schema() AS current_schema,
                  current_setting('server_version') AS server_version,
                  inet_server_addr()::text AS server_ip
              `);

              console.log(
                JSON.stringify(identity.rows[0], null, 2)
              );

              console.log('\n========== ENUM DIAGNOSTICS ==========\n');

              const enumResult = await client.query(`
                SELECT
                  t.typname,
                  n.nspname,
                  array_agg(
                    e.enumlabel ORDER BY e.enumsortorder
                  ) AS labels
                FROM pg_type t
                JOIN pg_enum e ON e.enumtypid = t.oid
                JOIN pg_namespace n ON n.oid = t.typnamespace
                WHERE n.nspname = 'public'
                  AND t.typname IN (
                    'request_status',
                    'request_type',
                    'user_role'
                  )
                GROUP BY t.typname, n.nspname
                ORDER BY t.typname
              `);

              const expectedEnums = {
                request_status: [
                  'registered',
                  'office_reviewing',
                  'needs_customer_info',
                  'in_progress',
                  'completed',
                  'rejected',
                  'cancelled'
                ],
                request_type: [
                  'driver',
                  'workshop'
                ],
                user_role: [
                  'customer',
                  'office_admin'
                ]
              };

              for (const [name, expected] of Object.entries(expectedEnums)) {
                const actual = enumResult.rows.find(
                  row => row.typname === name
                );

                console.log(`ENUM: ${name}`);

                console.log(
                  'ACTUAL:',
                  JSON.stringify(actual?.labels ?? null)
                );

                console.log(
                  'EXPECTED:',
                  JSON.stringify(expected)
                );

                console.log(
                  'MATCH:',
                  JSON.stringify(actual?.labels ?? null) ===
                  JSON.stringify(expected)
                );

                console.log('------------------------------');
              }

              console.log('\n========== TABLE DIAGNOSTICS ==========\n');

              const tables = await client.query(`
                SELECT
                  table_schema,
                  table_name
                FROM information_schema.tables
                WHERE table_schema = 'public'
                  AND table_type = 'BASE TABLE'
                ORDER BY table_name
              `);

              console.log(
                JSON.stringify(tables.rows, null, 2)
              );

              console.log('\n========== MIGRATION HISTORY ==========\n');

              const historyExists = await client.query(`
                SELECT to_regclass(
                  'drizzle.__drizzle_migrations'
                ) AS history_table
              `);

              console.log(
                'DRIZZLE HISTORY:',
                historyExists.rows[0].history_table
              );

              if (historyExists.rows[0].history_table) {
                const history = await client.query(`
                  SELECT id, hash, created_at
                  FROM drizzle.__drizzle_migrations
                  ORDER BY created_at, id
                `);

                console.log(
                  JSON.stringify(history.rows, null, 2)
                );
              }

              console.log('\n========== DIAGNOSTIC COMPLETE ==========\n');

              console.log(
                'READ-ONLY DIAGNOSTIC COMPLETED.'
              );

              console.log(
                'NO MIGRATIONS WERE EXECUTED.'
              );

              console.log(
                'NO DATABASE SCHEMA CHANGES WERE MADE.'
              );

            } finally {
              client.release();
            }

          } finally {
            await pool.end();
          }
          NODE
